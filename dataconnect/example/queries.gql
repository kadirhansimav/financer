query ListMyTransactions($userId: UUID!) @auth(level: USER) {
  transactions(where: {account: {user: {id: {eq: $userId}}}}) {
    id
    amount
    description
    transactionDate
  }
}

mutation CreateTransaction($accountId: UUID!, $categoryId: UUID!, $amount: Float!, $description: String!, $payeeSource: String!, $transactionDate: Date!, $type: String!) @auth(level: USER) {
  transaction_insert(data: {
    accountId: $accountId,
    categoryId: $categoryId,
    amount: $amount,
    description: $description,
    payeeSource: $payeeSource,
    transactionDate: $transactionDate,
    type: $type
  })
}

query GetAccountDetails($accountId: UUID!) @auth(level: USER) {
  account(id: $accountId) {
    id
    name
    accountType
    description
    initialBalance
    createdAt
    user {
      id
      displayName
      email
    }
  }
}